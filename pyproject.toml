[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-gap"
version = "0.1.0"
description = "Do a model's self-reports keep up with its behaviour when its internal state is set by intervention?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Alex Kwon" }]

# the stimuli module and its validator depend on nothing outside the standard library, on purpose:
# the guard must run anywhere so it can never be skipped for being inconvenient.
dependencies = []

[project.optional-dependencies]
# only the experiments need these. pinned because an unpinned transformers is a silent behaviour
# change in the middle of a three-day window.
run = [
    "torch==2.9.1",
    "transformers==5.12.1",
    "accelerate==1.11.0",
    "scikit-learn==1.7.2",
    "numpy==2.3.4",
    "sentencepiece==0.2.1",
    "modal==1.3.0",
]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
